services:
  - type: web
    name: ai-avatar
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_HOURS
        value: "72"
      - key: SMS_PROVIDER
        value: mock
      - key: SMS_DEBUG
        value: "1"
      # 以下变量需要在 Render Dashboard 手动填入真实值
      - key: MESHY_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
